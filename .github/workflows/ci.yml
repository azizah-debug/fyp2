name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  matlab-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update apt cache
        run: sudo apt-get update

      - name: Setup MATLAB (with retries)
        run: |
          set -e
          tries=0
          max=3
          until [ $tries -ge $max ]
          do
            tries=$((tries+1))
            echo "MATLAB setup attempt $tries/$max"
            if npx -y true 2>/dev/null; then :; fi
            # Try the setup action via a small inline script that calls the action via workflow command
            # Use the official action; if it fails, retry.
            # We call the action by invoking a small script that uses the action's installer commands.
            # If the action itself must be used as a step, the retry is handled by re-running the step via the loop.
            # Use the setup action via a separate workflow step below if this inline approach is not desired.
            break
          done

      - name: Setup MATLAB action
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2025a'

      - name: Add src and tools to path and run tests
        run: |
          matlab -batch "cd(pwd); addpath('src'); run('tests/run_all.m')"

      - name: Compile validation report
        run: |
          matlab -batch "cd(pwd); addpath('src'); addpath('tools'); run('tools/compile_validation_report.m')"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            results/validation_*.png
            results/validation_report.pdf
            results/validation_summary.csv
